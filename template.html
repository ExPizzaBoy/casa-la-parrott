<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Casa La Parrott</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --canvas: #e9eef5;
    --surface: #ffffff;
    --ink: #14203a;
    --muted: #5d6a82;
    --line: #dbe2ec;
    --soft: #f3f6fa;
    --feature: #14203a;        /* today's column in the week view */
    --feature-ink: #ffffff;
    --feature-soft: rgba(255,255,255,.12);
    --ok: #1f9d55;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --body: "Instrument Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --canvas: #0d1424; --surface: #161f33; --ink: #e8edf6; --muted: #93a0b8;
      --line: #263250; --soft: #1c2740; --feature: #e8edf6; --feature-ink: #14203a;
      --feature-soft: rgba(20,32,58,.08); --ok: #4ade80;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #0d1424; --surface: #161f33; --ink: #e8edf6; --muted: #93a0b8;
    --line: #263250; --soft: #1c2740; --feature: #e8edf6; --feature-ink: #14203a;
    --feature-soft: rgba(20,32,58,.08); --ok: #4ade80;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 28px 16px 24px; }
  @media (min-width: 820px) { .wrap { padding: 32px 32px 24px; } }

  /* ---------- header: the house name and the clock */
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
  h1 { margin: 0; font: 800 clamp(30px, 4.4vw, 56px)/.95 var(--display); font-stretch: 80%; letter-spacing: -.02em; }
  .date { margin-top: 8px; font-size: clamp(16px, 1.4vw, 19px); color: var(--muted); }
  .clock { font: 300 clamp(44px, 7vw, 96px)/.85 var(--display); font-stretch: 75%; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .clock .ap { font-size: .32em; font-weight: 500; letter-spacing: 0; color: var(--muted); margin-left: .25em; }

  /* ---------- week overview */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 20px; }
  @media (max-width: 820px) {
    .week { grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: 44%; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
    .day { scroll-snap-align: start; }
  }
  .day { background: var(--surface); border-radius: 20px; padding: 14px 10px 10px; min-height: 150px; display: flex; flex-direction: column; gap: 6px; }
  .day-hd { display: flex; align-items: baseline; gap: 8px; padding: 0 4px 6px; }
  .day-num { font: 700 30px/1 var(--display); font-stretch: 80%; letter-spacing: -.02em; }
  .day-name { font-weight: 600; color: var(--muted); }
  .day.is-today { background: var(--feature); color: var(--feature-ink); }
  .day.is-today .day-name { color: inherit; opacity: .7; }
  .day.is-weekend:not(.is-today) { background: var(--soft); }
  .mini { display: grid; grid-template-columns: 4px 1fr; gap: 8px; padding: 6px 8px 6px 6px; border-radius: 10px; background: color-mix(in srgb, var(--c) 11%, transparent); }
  .mini::before { content: ""; border-radius: 4px; background: var(--c); }
  .is-today .mini { background: var(--feature-soft); }
  .mini b { font-weight: 600; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mini small { display: block; font-size: 12.5px; opacity: .72; margin-top: 1px; }
  .free { color: var(--muted); font-size: 14px; padding: 2px 6px; }
  .is-today .free { color: inherit; opacity: .6; }

  /* ---------- alerts */
  #notices { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  #notices:empty { display: none; }
  .notice { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--c); font-size: 17px; }
  .notice .ico { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); font-size: 17px; }
  .notice .when { color: var(--muted); }

  /* ---------- main sheet: agenda | bags | coming up */
  .sheet { background: var(--surface); border-radius: 28px; display: grid; grid-template-columns: 1.25fr 1.2fr .9fr; }
  .col { padding: 24px 26px 26px; min-width: 0; }
  .col + .col { border-left: 1px solid var(--line); }
  @media (max-width: 1100px) { .sheet { grid-template-columns: 1fr 1fr; } .col.upcoming { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } }
  @media (max-width: 720px) { .sheet { grid-template-columns: 1fr; } .col + .col { border-left: 0; border-top: 1px solid var(--line); } }
  h2 { margin: 0 0 14px; font: 700 24px/1.1 var(--display); font-stretch: 85%; letter-spacing: -.01em; }
  h2 .count { font: 500 15px var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
  .agenda + h2 { margin-top: 28px; }
  .empty { color: var(--muted); padding: 6px 0; }

  .ev { display: grid; grid-template-columns: 116px 1fr; gap: 14px; padding: 12px 10px; margin: 0 -10px; border-radius: 14px; }
  .ev + .ev { position: relative; }
  .ev + .ev::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; border-top: 1px solid var(--line); }
  .ev.now::before, .ev.now + .ev::before { display: none; }
  .ev .t { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14.5px; padding-top: 2px; }
  .ev .ti { font-weight: 600; font-size: 17px; line-height: 1.3; }
  .ev .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; align-items: center; font-size: 14px; color: var(--muted); }
  .ev.now { background: color-mix(in srgb, var(--c) 12%, transparent); }
  .ev.past { opacity: .42; }
  .now-pill { display: inline-block; font-weight: 600; font-size: 13px; color: #fff; background: var(--c); padding: 2px 9px; border-radius: 999px; }
  .who { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 3px; border-radius: 999px; background: color-mix(in srgb, var(--pc) 14%, transparent); color: var(--ink); font-size: 13.5px; font-weight: 500; }
  .who::before { content: ""; width: 18px; height: 18px; border-radius: 50%; background: var(--pc); }

  /* bags */
  .packs { display: grid; gap: 12px; }
  .pack { border-radius: 18px; padding: 16px 18px; background: var(--soft); }
  .pack-hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .tonight { font-size: 13px; font-weight: 600; color: var(--c); }
  .pack-title { font-weight: 600; font-size: 17px; margin: 10px 0 2px; }
  .pack-when { color: var(--muted); font-size: 14px; }
  .bar { height: 6px; border-radius: 6px; background: var(--line); margin: 12px 0 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--c); border-radius: 6px; transition: width .3s ease; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 12px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 6px 0; cursor: pointer; font-size: 15.5px; }
  .item input { appearance: none; margin: 0; width: 22px; height: 22px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c) 55%, var(--line)); display: grid; place-items: center; flex: none; cursor: pointer; transition: background .15s, border-color .15s; }
  .item input:checked { background: var(--c); border-color: var(--c); }
  .item input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .item input:focus-visible { outline: 3px solid color-mix(in srgb, var(--c) 45%, transparent); outline-offset: 2px; }
  .item.done span { color: var(--muted); text-decoration: line-through; }
  .ready { color: var(--ok); font-weight: 600; font-size: 14px; }

  /* coming up */
  .cd { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center; padding: 12px 0; }
  .cd + .cd { border-top: 1px solid var(--line); }
  .cd .n { text-align: center; border-radius: 16px; padding: 10px 0 8px; background: color-mix(in srgb, var(--c) 13%, transparent); }
  .cd .n b { display: block; font: 700 34px/1 var(--display); font-stretch: 80%; color: var(--ink); }
  .cd .n small { font-size: 12.5px; color: var(--muted); }
  .cd .ti { font-weight: 600; font-size: 16.5px; line-height: 1.3; }
  .cd .sub { color: var(--muted); font-size: 14px; margin-top: 3px; }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 18px; padding: 0 6px; color: var(--muted); font-size: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .stale { color: #d9480f; font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- TV mode (open the page with ?tv): a fixed 16:9 canvas scaled to fill
     the screen, nothing to scroll or click, sized to read from the couch */
  html.tv, html.tv body { height: 100%; overflow: hidden; cursor: none; }
  .tv .wrap { width: 1600px; height: 900px; max-width: none; margin: 0; padding: 30px 40px 18px;
    display: flex; flex-direction: column; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
  .tv header { margin-bottom: 18px; }
  .tv h1 { font-size: 54px; }
  .tv .clock { font-size: 92px; }
  .tv .week { margin-bottom: 14px; }
  .tv .day { min-height: 0; height: 234px; overflow: hidden; padding-bottom: 8px; }
  .tv .mini b { font-size: 15px; -webkit-line-clamp: 1; }
  .tv .more { font-size: 13px; padding: 0 6px; opacity: .7; }
  .tv #notices { margin-bottom: 14px; }
  .tv .sheet { flex: 1; min-height: 0; grid-template-columns: 1.25fr 1.2fr .9fr; }
  .tv .col { overflow: hidden; padding: 20px 26px; border-top: 0;
    -webkit-mask-image: linear-gradient(#000 88%, transparent); mask-image: linear-gradient(#000 88%, transparent); }
  .tv .col + .col { border-left: 1px solid var(--line); }
  .tv .col.upcoming { grid-column: auto; }
  .tv .ev { padding: 9px 10px; }
  .tv .ev .ti { font-size: 18px; }
  .tv .agenda + h2 { margin-top: 18px; }
  /* bags become a read-only list on TV: no remote-control check boxes */
  .tv .bar, .tv .pack-hd .pack-when, .tv .item input { display: none; }
  .tv .pack { padding: 14px 18px; }
  .tv .items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tv .item { padding: 3px 12px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, transparent); font-size: 15px; cursor: none; }
  .tv footer { margin-top: 10px; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title">Casa La Parrott</h1><div class="date" id="date"></div></div>
    <div class="clock" id="clock" aria-live="off"></div>
  </header>
  <div class="week" id="week"></div>
  <div id="notices"></div>
  <main class="sheet">
    <section class="col">
      <h2>Today</h2><div class="agenda" id="today"></div>
      <h2>Tomorrow</h2><div class="agenda" id="tomorrow"></div>
    </section>
    <section class="col">
      <h2>Bags to pack</h2><div id="packs" class="packs"></div>
    </section>
    <section class="col upcoming">
      <h2>Coming up</h2><div id="countdown"></div>
    </section>
  </main>
  <footer><div class="legend" id="legend"></div><div id="updated"></div></footer>
</div>

<script>
let DATA = /*__DATA__*/null;
const LOADED = Date.now();
const $ = id => document.getElementById(id);

// ?tv  -> TV mode (dark, fixed 16:9 canvas scaled to the screen, burn-in shift)
// ?theme=light|dark -> force a theme on any screen
const PARAMS = new URLSearchParams(location.search);
const TV = PARAMS.has("tv");
if (PARAMS.get("theme")) document.documentElement.dataset.theme = PARAMS.get("theme");
if (TV) {
  document.documentElement.classList.add("tv");
  if (!PARAMS.get("theme")) document.documentElement.dataset.theme = "dark";
  let shift = 0;
  const fit = () => {
    const wrap = document.querySelector(".wrap");
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    const dx = (innerWidth - 1600 * s) / 2, dy = (innerHeight - 900 * s) / 2;
    const nudge = [[0, 0], [3, 2], [-2, 3], [2, -3], [-3, -2]][shift % 5]; // keeps OLED TVs from burning in
    wrap.style.transform = `translate(${dx + nudge[0]}px, ${dy + nudge[1]}px) scale(${s})`;
  };
  addEventListener("resize", fit);
  fit();
  setInterval(() => { shift++; fit(); }, 10 * 60 * 1000);
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} },
};

function tzKey(d) {
  return new Intl.DateTimeFormat("en-CA", { timeZone: DATA.timezone, year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
}
function addDays(key, n) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
const fmtKey = (key, opts) => new Intl.DateTimeFormat("en-US", { timeZone: "UTC", ...opts }).format(new Date(key + "T12:00:00Z"));
function diffDays(a, b) { return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function startMs(ev) { return ev.allDay ? Date.parse(ev.start + "T00:00:00") : Date.parse(ev.start); }
function endMs(ev) { return ev.allDay ? Date.parse(ev.end + "T00:00:00") : Date.parse(ev.end); }

const pcolor = p => DATA.people[p] || "#868e96";
const color = ev => pcolor(ev.who[0]);
const icons = ev => ev.cats.map(c => DATA.categories[c]?.icon || "").join("");
const whoPills = ev => ev.who.map(p => `<span class="who" style="--pc:${esc(pcolor(p))}">${esc(p)}</span>`).join("");
const onDay = key => DATA.events.filter(ev => ev.days.includes(key));

function eventRow(ev, now) {
  let cls = "";
  if (!ev.allDay) {
    if (now >= startMs(ev) && now < endMs(ev)) cls = "now";
    else if (now >= endMs(ev)) cls = "past";
  }
  return `<div class="ev ${cls}" style="--c:${esc(color(ev))}">
    <div class="t">${cls === "now" ? `<span class="now-pill">Now</span>` : esc(ev.time)}</div>
    <div><div class="ti">${esc(ev.title)} ${icons(ev)}</div>
    <div class="meta">${whoPills(ev)}${ev.location ? `<span>${esc(ev.location)}</span>` : ""}${cls === "now" ? `<span>until ${esc(ev.time.split(" – ")[1] || "")}</span>` : ""}</div></div>
  </div>`;
}

function render() {
  if (!DATA) return;
  const nowD = new Date(), now = nowD.getTime();
  const today = tzKey(nowD), tomorrow = addDays(today, 1);

  $("title").textContent = DATA.title;
  document.title = DATA.title;
  $("date").textContent = new Intl.DateTimeFormat("en-US", { timeZone: DATA.timezone, weekday: "long", month: "long", day: "numeric" }).format(nowD);
  const t = new Intl.DateTimeFormat("en-US", { timeZone: DATA.timezone, hour: "numeric", minute: "2-digit" }).format(nowD);
  $("clock").innerHTML = t.replace(/\s?(AM|PM)$/, (_, ap) => `<span class="ap">${ap.toLowerCase()}</span>`);

  // Week overview
  let week = "";
  for (let i = 0; i < 7; i++) {
    const key = addDays(today, i);
    const wd = fmtKey(key, { weekday: "short" });
    const evs = onDay(key);
    const cls = [i === 0 && "is-today", (wd === "Sat" || wd === "Sun") && "is-weekend"].filter(Boolean).join(" ");
    week += `<div class="day ${cls}">
      <div class="day-hd"><span class="day-num">${Number(key.slice(8))}</span><span class="day-name">${i === 0 ? "Today" : i === 1 ? "Tomorrow" : wd}</span></div>
      ${(TV && evs.length > 3 ? evs.slice(0, 2) : evs).map(ev => `<div class="mini" style="--c:${esc(color(ev))}"><div><b>${esc(ev.title)}</b><small>${esc(ev.short)}, ${esc(ev.who.join(" & "))}</small></div></div>`).join("") || `<div class="free">Nothing planned</div>`}${TV && evs.length > 3 ? `<div class="more">+${evs.length - 2} more</div>` : ""}
    </div>`;
  }
  $("week").innerHTML = week;

  // Alerts: banner categories for today and tomorrow
  const bannerCats = Object.keys(DATA.categories).filter(k => DATA.categories[k].banner);
  const notices = [];
  for (const [key, label] of [[today, "today"], [tomorrow, "tomorrow"]]) {
    for (const ev of onDay(key)) {
      if (ev.cats.some(c => bannerCats.includes(c)) && endMs(ev) > now) {
        notices.push(`<div class="notice" style="--c:${esc(color(ev))}"><span class="ico">${icons(ev) || "📣"}</span>
          <span><b>${esc(ev.who.join(" & "))}</b>: ${esc(ev.title)}</span>
          <span class="when">${label}${ev.allDay ? "" : ", " + esc(ev.time)}</span></div>`);
      }
    }
  }
  $("notices").innerHTML = notices.join("");

  const list = (key, emptyMsg) => {
    const evs = onDay(key);
    return evs.length ? evs.map(ev => eventRow(ev, now)).join("") : `<div class="empty">${emptyMsg}</div>`;
  };
  $("today").innerHTML = list(today, "Nothing on the calendar today.");
  $("tomorrow").innerHTML = list(tomorrow, "Nothing planned for tomorrow.");

  // Bags: events with a packing list, starting within the lead window, not over yet
  const horizon = now + DATA.packLeadHours * 36e5;
  const packs = DATA.events.filter(ev => ev.pack.length && endMs(ev) > now && startMs(ev) <= horizon);
  $("packs").innerHTML = packs.length ? packs.map(ev => {
    const key = ev.days[0];
    const when = key === today ? "Today" : key === tomorrow ? "Tomorrow" : fmtKey(key, { weekday: "long" });
    const done = ev.pack.filter(item => store.get(`pack:${ev.id}:${item}`) === "1").length;
    const items = ev.pack.map(item => {
      const on = store.get(`pack:${ev.id}:${item}`) === "1";
      return `<label class="item ${on ? "done" : ""}"><input type="checkbox" data-k="pack:${esc(ev.id)}:${esc(item)}" ${on ? "checked" : ""}><span>${esc(item)}</span></label>`;
    }).join("");
    const status = done === ev.pack.length ? `<span class="ready">Bag is ready</span>`
      : key === tomorrow ? `<span class="tonight">Pack tonight</span>` : `<span class="pack-when">${done} of ${ev.pack.length} packed</span>`;
    return `<div class="pack" style="--c:${esc(color(ev))}">
      <div class="pack-hd">${whoPills(ev)}${status}</div>
      <div class="pack-title">${esc(ev.title)} ${icons(ev)}</div>
      <div class="pack-when">${when}, ${esc(ev.time)}${ev.location ? ` at ${esc(ev.location)}` : ""}</div>
      <div class="bar"><i style="width:${Math.round(100 * done / ev.pack.length)}%"></i></div>
      <div class="items">${items}</div>
    </div>`;
  }).join("") : `<div class="empty">No bags to pack in the next day and a half.</div>`;

  // Coming up
  const cdCats = Object.keys(DATA.categories).filter(k => DATA.categories[k].countdown);
  const seen = new Set();
  const cds = DATA.events.filter(ev => {
    if (!ev.cats.some(c => cdCats.includes(c)) || endMs(ev) <= now) return false;
    const k = ev.title + ev.days[0];
    if (seen.has(k)) return false;
    seen.add(k);
    return diffDays(today, ev.days[0]) <= DATA.countdownDays;
  }).slice(0, 6);
  $("countdown").innerHTML = cds.length ? cds.map(ev => {
    const n = Math.max(0, diffDays(today, ev.days[0]));
    const big = n === 0 ? "🎉" : n;
    const small = n === 0 ? "today" : n === 1 ? "day" : "days";
    const when = fmtKey(ev.days[0], { weekday: "long", month: "short", day: "numeric" });
    return `<div class="cd" style="--c:${esc(color(ev))}"><div class="n"><b>${big}</b><small>${small}</small></div>
      <div><div class="ti">${esc(ev.title)} ${icons(ev)}</div>
      <div class="sub">${when}${ev.allDay ? "" : ", " + esc(ev.short)}</div></div></div>`;
  }).join("") : `<div class="empty">Nothing special in the next two months yet.</div>`;

  $("legend").innerHTML = Object.keys(DATA.people).map(p => `<span class="who" style="--pc:${esc(pcolor(p))}">${esc(p)}</span>`).join("");
  const mins = Math.round((now - Date.parse(DATA.generated)) / 6e4);
  const ago = mins < 1 ? "just now" : mins < 60 ? `${mins} min ago` : `${Math.round(mins / 60)} hr ago`;
  const problems = DATA.problems?.length ? `. Couldn't load: ${esc(DATA.problems.join(", "))}` : "";
  $("updated").innerHTML = mins > 120 ? `<span class="stale">Calendars last updated ${ago}</span>${problems}` : `Calendars updated ${ago}${problems}`;
}

document.addEventListener("change", e => {
  const k = e.target.dataset?.k;
  if (k) { store.set(k, e.target.checked ? "1" : ""); render(); }
});

async function refresh() {
  if (Date.now() - LOADED > 6 * 36e5) return location.reload(); // pick up page changes
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) { DATA = await r.json(); render(); }
  } catch { /* opened as a local file, or offline: keep showing what we have */ }
}

render();
setInterval(render, 30 * 1000);
setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
</html>
